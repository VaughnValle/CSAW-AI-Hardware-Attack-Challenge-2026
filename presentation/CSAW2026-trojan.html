  const notes={"1": "Our IP core is a small crypto accelerator delivered only as an FPGA bitstream. The project is a three-part arc: recover an inspectable circuit, prove we understand its normal behavior, then use AI to insert and demonstrate a hardware Trojan. All three are done. The baseline passes 127 self-checks, the Trojan and its exploit pass 140, and a single script reproduces every simulation result. We also took the attack all the way onto the physical Hackster board: it behaves exactly like the clean core until a secret input sequence fires the payload. These slides walk through those findings.", "2": "The core takes a 32-bit word over SPI, where the RP2040 is the controller and the FPGA is the peripheral. It deliberately avoids a heavy bus. The key architectural quirk is a unified clock domain: the same SCK that shifts SPI bits also clocks the cipher. A normal transaction loads 32 bits with chip-select low, pulses START, then reads 32 bits back. The waveform on the right is from our simulation: BUSY asserts with START, stays high for three clock edges, and drops at edge four \u2014 but note the result only becomes readable at edge five, which matters later.", "3": "We start from only the .bin. iceunpack turns it into an ASCII config \u2014 that's how we learn it's the 5k device \u2014 and icebox_vlog lifts it to a structural Verilog netlist with nine ports and four block RAMs. Our recover.py is content-addressed: it hashes the input, logs every command, and asserts that the one cosmetic edit we make \u2014 converting ANSI scalar port headers so Icarus will compile it \u2014 leaves the circuit body byte-for-byte unchanged. Everything is open-source: IceStorm, Yosys, Icarus Verilog. Be clear about provenance: the bitstream, the datasheet, and the solution PDF with the key and round functions were supplied; the recovered netlist and all analysis are ours.", "4": "Before touching anything, we prove we understand the normal core. I built an independent reference model of the two round functions from the solution PDF and ran 120 vectors \u2014 edge cases plus seeded random, both modes \u2014 against the recovered netlist. All pass, plus round-trip, reset, and back-to-back checks. This also settled an open question from the handoff: there is no mode-versus-name swap. Encrypt mode really is the PDF's encryption function; the earlier swap theory came from a software mis-transcription. And a concrete measured finding: the result isn't actually ready when BUSY drops at edge four \u2014 you need five edges. The host script's eight is safely conservative.", "5": "The challenge is really about AI usage, so we log it. The AI received the recovered netlist, the datasheet, the supplied S-box, key and round equations, and the observed vectors. The process is generate-test-revise and it's recorded \u2014 the clearest example: my first reference model failed all four known vectors because the mode mapping was backwards; the test output drove the fix, and it then passed. Every line of RTL and every testbench is AI-generated; I review and run them. On guardrails, the honest answer is the interesting one: nothing refused this and I used no bypass. Given an authorized academic security context, the model generated the Trojan trigger and payload directly. The only safety-shaped behavior was self-imposed \u2014 keeping it tiny, labeling the malicious code, and reporting honestly that it's detectable rather than claiming it's invisible.", "6": "The Trojan is inserted at design time into readable RTL, so a two-file diff is the entire modification. The trigger is a sequential, input-controlled one: it only arms after three specific 32-bit words arrive in order, each as a completed transaction. Any wrong word resets progress, and a hardware reset dis-arms it \u2014 so it's rare and controllable. The payload is deliberately surgical: it inverts a single output bit on exactly one result, delivered through the existing SPI output path, so there are no new pins. In taxonomy terms: design-time RTL insertion, digital sequential trigger, functional-corruption integrity payload, existing channel, one-result scope. The cost is just a capture register and a two-bit counter.", "7": "Here's the proof. On 120 ordinary transactions the Trojan core is bit-identical to the clean golden core \u2014 fully dormant. When the secret sequence completes, the output changes by exactly one bit: the waveform on the right shows the golden and Trojan serial outputs agreeing until the very last bit, which flips. Every near-miss case \u2014 wrong final word, wrong middle word, wrong order, reset in the middle \u2014 correctly suppresses the payload, and it re-arms and fires again cleanly. That's 140 checks, zero failures. And this isn't only simulation: we synthesized the Trojan to a real bitstream, flashed it to the Hackster board, and the ordinary encrypt/decrypt test still passed while our exploit sent the three-word sequence and read back the corrupted value 4f92e7f8 on real silicon, recovering right after. Crucially I measured stealth instead of assuming it: the Trojan adds about three-and-a-half percent more cells, so an area diff or a known-answer test would catch it. Simulation is thorough but not a universal proof.", "8": "Division of labor: I work solo, so I own the requirements, scope decisions, the board, and running, reviewing and accepting every piece of generated code \u2014 and giving this talk. The hardware itself is written by my AI collaborators: GPT-6.1 handled recovery and the first probe, and Claude Opus did the baseline hardening, the Trojan, the exploit, and these slides. Per the rules, all hardware and exploit code is AI-generated and I keep the full prompts, generated code, and test feedback in the repo. We already took it onto the real board \u2014 confirmed AppMicro, backed up and flashed the FPGA, reproduced the exploit on silicon, and restored the clean image. The clear next step is a power side-channel attack \u2014 correlation power analysis on the first-round S-box output \u2014 to recover the key independently from the chip rather than relying on the value the PDF supplied; the board already exposes a power tap and a trigger connector for exactly that. After that come the finals' physical challenges. Everything \u2014 RTL, testbenches, AI logs, the technical brief, and this deck \u2014 goes to my GitHub fork."};
  let i=0, showNotes=true;
  function render(){
    document.getElementById('slide').src=slides[i];
    document.getElementById('count').textContent=(i+1)+' / '+slides.length;
    document.getElementById('noteText').textContent=notes[String(i)]||'(title slide)';
  }
  function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));render();}
  function toggleNotes(){showNotes=!showNotes;document.getElementById('notes').style.display=showNotes?'block':'none';}
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key.toLowerCase()==='n')toggleNotes();});
  render();
</script></body></html>

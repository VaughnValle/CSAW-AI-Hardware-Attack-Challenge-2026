<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica,Arial,sans-serif">
<rect width="1280" height="720" fill="#0f1724"/>
<rect x="0" y="0" width="12" height="720" fill="#4f8cff"/>
<text x="64" y="62" font-size="18" fill="#4f8cff" letter-spacing="2">WHAT IT DOES</text>
<text x="64" y="112" font-size="40" font-weight="bold" fill="#e8eefc">Accelerator architecture &amp; ordinary transaction</text>
<line x1="64" y1="134" x2="1224" y2="134" stroke="#2a3a5c" stroke-width="1.5"/>
<circle cx="70" cy="174" r="4" fill="#4f8cff"/>
<text x="86" y="182" font-size="22" fill="#e8eefc">32-bit, 4-round block cipher. Raw SPI peripheral +</text>
<text x="86" y="215" font-size="22" fill="#e8eefc">sideband control (no AXI/Wishbone).</text>
<circle cx="70" cy="253" r="4" fill="#e8eefc"/>
<text x="86" y="261" font-size="22" fill="#e8eefc">Unified clock: SCK drives both the SPI shift register</text>
<text x="86" y="294" font-size="22" fill="#e8eefc">and the crypto engine.</text>
<circle cx="70" cy="332" r="4" fill="#e8eefc"/>
<text x="86" y="340" font-size="22" fill="#e8eefc">Transaction: reset → shift 32 bits in (CS low) → pulse</text>
<text x="86" y="373" font-size="22" fill="#e8eefc">START → wait → shift 32 bits out.</text>
<circle cx="70" cy="411" r="4" fill="#34d399"/>
<text x="86" y="419" font-size="22" fill="#e8eefc">BUSY high through edges 1-3, low from edge 4; result</text>
<text x="86" y="452" font-size="22" fill="#e8eefc">loads on edge 5.</text>
<circle cx="70" cy="490" r="4" fill="#9fb0cc"/>
<text x="86" y="498" font-size="22" fill="#e8eefc">ENC_DEC: 0 = encrypt, 1 = decrypt. BUSY is mirrored on</text>
<text x="86" y="531" font-size="22" fill="#e8eefc">ICE_LED.</text><rect x="704" y="196" width="512" height="300" rx="10" fill="#ffffff"/><g transform="translate(704.0,264.8) scale(0.5447)">
<rect width="940" height="298" fill="#ffffff"/>
<text x="150" y="34" font-size="20" font-weight="bold" fill="#1a1a2e">Ordinary transaction: BUSY falls at edge 4, result loads at edge 5</text>

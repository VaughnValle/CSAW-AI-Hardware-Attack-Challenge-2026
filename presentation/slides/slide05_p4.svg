<circle cx="70" cy="174" r="4" fill="#4f8cff"/>
<text x="86" y="182" font-size="22" fill="#e8eefc">Independent Python reference model of the two PDF round functions (AES S-box, K=0x8E043CB1, 4 rounds).</text>
<circle cx="70" cy="220" r="4" fill="#34d399"/>
<text x="86" y="228" font-size="22" fill="#e8eefc">Self-checking bench vs the recovered netlist: 60 inputs x 2 modes = 120/120; round-trip + reset + back-</text>
<text x="86" y="261" font-size="22" fill="#e8eefc">to-back.</text>
<circle cx="70" cy="299" r="4" fill="#fbbf24"/>
<text x="86" y="307" font-size="22" fill="#e8eefc">Resolved the open question: NO mode/function swap. mode0 = PDF encrypt, mode1 = PDF decrypt — names</text>
<text x="86" y="340" font-size="22" fill="#e8eefc">agree.</text>
<circle cx="70" cy="378" r="4" fill="#9fb0cc"/>
<text x="86" y="386" font-size="22" fill="#e8eefc">The earlier &#x27;swap&#x27; came from a mis-transcribed software cipher (0x137B1F72 is really the decrypt</text>
<text x="86" y="419" font-size="22" fill="#e8eefc">output).</text>
<circle cx="70" cy="457" r="4" fill="#34d399"/>
<text x="86" y="465" font-size="22" fill="#e8eefc">Measured timing: minimum safe readback = 5 SCK edges, not 4 (BUSY-low ≠ result ready).</text>

<text x="86" y="261" font-size="22" fill="#e8eefc">Generate-test-revise is logged. Real revision: first reference model failed all 4 vectors → fixed the</text>
<text x="86" y="294" font-size="22" fill="#e8eefc">mode mapping → passed.</text>
<circle cx="70" cy="332" r="4" fill="#e8eefc"/>
<text x="86" y="340" font-size="22" fill="#e8eefc">All RTL, testbenches, scripts, and waveplots are AI-generated; the human reviews, runs, and accepts.</text>
<circle cx="70" cy="378" r="4" fill="#fbbf24"/>
<text x="86" y="386" font-size="22" fill="#e8eefc">Guardrails — honest account: no refusal and no bypass. In a sanctioned academic context the model built</text>
<text x="86" y="419" font-size="22" fill="#e8eefc">the Trojan directly.</text>
<circle cx="70" cy="457" r="4" fill="#9fb0cc"/>
<text x="86" y="465" font-size="22" fill="#e8eefc">Only &#x27;guardrail-like&#x27; behavior was voluntary: narrow scope, Trojan logic labeled, stealth stated as</text>
<text x="86" y="498" font-size="22" fill="#e8eefc">detectable.</text>
<text x="1224" y="692" font-size="15" text-anchor="end" fill="#9fb0cc">CSAW 2026 AI Hardware Attack Challenge — NYU Design Project</text>
